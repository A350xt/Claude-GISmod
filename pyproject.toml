[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-gis"
version = "0.3.0"
description = "Claude-GISmod - agent-native GIS kernel behind the Claude-GISmod Claude Code mod"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.7",
  "pandas>=2.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
raster = ["rasterio>=1.3", "scipy>=1.11"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
